name: Source checks and Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: ./tools/check-secrets.ps1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check commit email privacy
        run: python tools/check-public-metadata.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install PC dependencies
        run: python -m pip install -r tools/web-requirements.txt
      - name: Run device-free checks
        run: python tools/check.py
      - name: Check Java format
        run: ./tools/format-java.ps1 -Check
      - name: Install Android build packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-34' 'build-tools;36.0.0'
          if ($LASTEXITCODE) { throw 'SDK package installation failed' }
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV
      - name: Build both applications with disposable CI signing
        shell: pwsh
        run: |
          ./work/android-player/build.ps1
          ./work/android-diagnostics/build.ps1
      - name: Verify build does not modify tracked source
        run: git diff --exit-code
      - name: Build Windows desktop WEB tool
        run: |
          python -m pip install -r tools/web-desktop-build-requirements.txt
          if ($LASTEXITCODE) { throw 'Desktop build dependency installation failed' }
          ./tools/build-web-desktop.ps1
      - name: Check packaged desktop resources and pairing crypto
        shell: pwsh
        run: |
          $resultPath=Join-Path $PWD 'local/web-desktop-build/ci-self-test.json'
          $testData=Join-Path $PWD 'local/web-desktop-build/ci-test-data'
          New-Item -ItemType Directory -Force $testData | Out-Null
          $exe=Join-Path $PWD 'outputs/PC-WEB-EXE/LivingRoomWeb/LivingRoomWeb.exe'
          $process=Start-Process -FilePath $exe -ArgumentList @('--self-test','--data-dir',('"'+$testData+'"'),'--result',('"'+$resultPath+'"')) -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged desktop self-test timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $resultPath)) { throw 'Packaged desktop self-test did not complete' }
          $result=Get-Content -Raw -LiteralPath $resultPath | ConvertFrom-Json
          if (!$result.ok) { throw 'Packaged desktop self-test failed' }
          git diff --exit-code
